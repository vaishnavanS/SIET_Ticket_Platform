{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - SIET Helpdesk</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <header class="navbar">
        <span class="logo-text">SIET-Helpdesk</span>
        <span class="service-text">Campus IT Service Desk</span>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="{% static 'images/logo.jpg' %}" alt="SIET Logo" class="logo">
            </div>

            <h1>Password Updated</h1>

            <div class="login-form">
                <p class="reset-desc">
                    Your password has been reset successfully! You can now log in with your new password.
                </p>

                <div class="forgot-password" style="margin-top: 10px;">
                    <a href="{% url 'accounts:login' %}" class="login-btn">Go to Login</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        &copy; SIET Campus IT Service Desk
    </footer>
</body>
</html>
