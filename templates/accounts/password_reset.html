{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SIET Helpdesk</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <header class="navbar">
        <span class="logo-text">SIET-Helpdesk</span>
        <span class="service-text">Campus IT Service Desk</span>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="{% static 'images/logo.jpg' %}" alt="SIET Logo" class="logo">
            </div>

            <h1>Reset Password</h1>

            <form method="post" class="login-form">
                {% csrf_token %}

                <p class="reset-desc">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div class="form-group">
                    <label for="id_email">Email Address</label>
                    <input type="email" id="id_email" name="email" 
                           placeholder="Enter your email address" required>
                </div>

                <button type="submit" class="login-btn">Send Reset Link</button>
            </form>

            <div class="forgot-password">
                <a href="{% url 'accounts:login' %}">&larr; Back to Login</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        &copy; SIET Campus IT Service Desk
    </footer>
</body>
</html>
